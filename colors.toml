# Pixel Art theme — Omarchy 4 (Quattro) colors.toml
# Palette: Gruvbox-inspired pixel-art dark

mode = "dark"

accent = "#83A598"             # Pixel Art blue as primary accent
selection = "#665C54"          # Selection background
muted = "#7C6F64"              # Dim / inactive elements

background = "#1D2021"         # Pixel Art Dark background
dark_background = "#141414"    # Sunk panels, wells
darker_background = "#101010"  # Deepest layer (lock screen, OSD)
lighter_background = "#282828" # Raised surfaces, cards

foreground = "#D5C4A1"         # Primary text
dark_foreground = "#665C54"    # Low-emphasis text
light_foreground = "#EBDBB2"   # Emphasized text
bright_foreground = "#EBDBB2"  # Highest-contrast text

red = "#CC241D"
yellow = "#D79921"
orange = "#E78A4E"
green = "#B8BB26"
cyan = "#8EC07C"
blue = "#83A598"
magenta = "#D3869B"
brown = "#70432E"

bright_red = "#EA6962"
bright_yellow = "#E78A4E"
bright_green = "#A9B665"
bright_cyan = "#89B482"
bright_blue = "#7DAEA3"
bright_magenta = "#D3869B"
